<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a101d" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCardRev {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    .pulse-bg {
      animation: pulseGlow 6s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .float-item-1 {
      animation: floatCard 5s ease-in-out infinite;
    }
    .float-item-2 {
      animation: floatCardRev 6s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.2" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glowing Dynamic Circles -->
  <circle cx="200" cy="180" r="160" fill="#3b82f6" opacity="0.25" filter="url(#glow)" class="pulse-bg" />
  <circle cx="1000" cy="140" r="150" fill="#8b5cf6" opacity="0.3" filter="url(#glow)" class="pulse-bg" />
  <circle cx="600" cy="300" r="120" fill="#ec4899" opacity="0.15" filter="url(#glow)" class="pulse-bg" />

  <!-- Left Header & Info Content -->
  <g transform="translate(60, 50)">
    <!-- Top Pill Tag -->
    <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="16" cy="16" r="6" fill="#10b981" />
    <text x="32" y="21" class="badge-text" fill="#38bdf8">🚀 THE ULTIMATE CURATED DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="82" class="title-text">
      Equity Compensation
    </text>
    <text x="0" y="130" class="title-text" fill="url(#accentGrad)">
      &amp; Cap Table Ecosystem
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" class="subtitle-text">
      Curated SaaS platforms, Open-Source protocols (OCF), ESOP administration,
    </text>
    <text x="0" y="194" class="subtitle-text">
      409A valuations, dilution scenario modeling &amp; stock option accounting.
    </text>

    <!-- Category Feature Pills -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="badge-text">📊 Cap Tables</text>

      <rect x="147" y="0" width="120" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="160" y="22" class="badge-text">💎 ESOP Plans</text>

      <rect x="279" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="292" y="22" class="badge-text">📜 Open Cap (OCF)</text>

      <rect x="436" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="449" y="22" class="badge-text">⚡ 409A Valuation</text>
    </g>
  </g>

  <!-- Right Visual Graphics: Floating UI Cards -->
  <!-- Card 1: Equity Breakdown Chart -->
  <g class="float-item-1" transform="translate(790, 45)" filter="url(#softShadow)">
    <rect width="350" height="135" rx="14" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
    
    <text x="22" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
      Ownership Distribution
    </text>
    <text x="280" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#10b981">
      +100.0%
    </text>

    <!-- Progress Bars / Distribution -->
    <g transform="translate(22, 50)">
      <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Founders (55%)</text>
      <rect x="130" y="4" width="180" height="12" rx="6" fill="#1e293b" />
      <rect x="130" y="4" width="99" height="12" rx="6" fill="url(#accentGrad)" />

      <text x="0" y="38" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Investors (30%)</text>
      <rect x="130" y="28" width="180" height="12" rx="6" fill="#1e293b" />
      <rect x="130" y="28" width="54" height="12" rx="6" fill="url(#goldGrad)" />

      <text x="0" y="62" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">ESOP Pool (15%)</text>
      <rect x="130" y="52" width="180" height="12" rx="6" fill="#1e293b" />
      <rect x="130" y="52" width="27" height="12" rx="6" fill="url(#emeraldGrad)" />
    </g>
  </g>

  <!-- Card 2: Vesting & Open Protocol Metric Card -->
  <g class="float-item-2" transform="translate(830, 195)" filter="url(#softShadow)">
    <rect width="310" height="120" rx="14" fill="url(#cardGrad)" stroke="#4338ca" stroke-width="1.5" />
    
    <circle cx="45" cy="48" r="22" fill="#312e81" stroke="#6366f1" stroke-width="2" />
    <path d="M38 48 L43 53 L53 42" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <text x="80" y="44" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      Open Cap Format (OCF)
    </text>
    <text x="80" y="64" font-family="-apple-system, sans-serif" font-size="12" fill="#818cf8">
      Standardized &amp; Portable
    </text>

    <!-- Bottom Stat Pill -->
    <rect x="22" y="84" width="266" height="24" rx="6" fill="#1e1b4b" />
    <text x="32" y="100" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe">
      🔒 100% Data Sovereignty • Audit Ready
    </text>
  </g>

  <!-- Decorative Border Gradient Highlight -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
